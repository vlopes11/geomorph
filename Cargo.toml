[package]
name = "geomorph"
edition = "2024"
version = "2.0.2"
authors = ["Victor Lopez <vhrlopes@gmail.com>"]
description = "Simple conversion between different coordinate systems"
readme = "README.md"
license = "MIT"
repository = "https://github.com/vlopes11/geomorph"
keywords = ["geo", "geospatial", "coordinates", "transforms", "transformations"]

[badges]
travis-ci = { repository = "vlopes11/geomorph" }

[dependencies]
num-complex = { version = "0.4", default-features = false }
num-traits = { version = "0.2", default-features = false, features = ["libm"] }

[features]
default = ["std"]
std = ["num-complex/default", "num-traits/default"]
